services:

  coletivo_bem_viver_web:
    build:  .
    env_file:
      - .env
    restart: always
    ports:
      - 8000:8000
    depends_on:
      - coletivo_bem_viver_db
  
  coletivo_bem_viver_db:
    image: postgres:15
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
  
volumes:
  postgres_data:
  