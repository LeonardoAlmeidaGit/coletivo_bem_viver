{% extends 'base.html' %}

{% block title %}Excluir Cardápio - Coletivo Bem Viver{% endblock %}

{% block content %}

<section class="min-h-screen bg-gray-50 flex items-center justify-center py-16 px-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-10 text-center">

            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </div>

            <h1 class="text-2xl font-bold text-gray-800 mb-3">Excluir cardápio</h1>
            <p class="text-gray-500 text-lg mb-2">Tem certeza que deseja excluir o cardápio de</p>
            <p class="text-gray-800 font-semibold text-xl mb-8">{{ menu.date|date:"d/m/Y" }}</p>
            <p class="text-gray-400 text-base mb-8">Essa ação não pode ser desfeita.</p>

            <form method="post" class="flex gap-4">
                {% csrf_token %}
                <a href="{% url 'menu_list' kitchen.pk %}"
                   class="flex-1 border border-gray-200 text-gray-600 hover:bg-gray-50 font-semibold text-lg py-3 rounded-lg transition-colors duration-200">
                    Cancelar
                </a>
                <button type="submit"
                        class="flex-1 bg-red-600 text-white hover:bg-red-700 font-semibold text-lg py-3 rounded-lg transition-colors duration-200">
                    Excluir
                </button>
            </form>
        </div>
    </div>
</section>

{% endblock %}
